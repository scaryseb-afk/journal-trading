<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mardi 25 août — Journal</title>
<link rel="stylesheet" href="../_systeme/style.css">
<style>
.sp-back{color:var(--muted);font-weight:600;font-size:.88rem;text-decoration:none;display:inline-flex;align-items:center;gap:6px;margin-bottom:24px}
.sp-back:hover{color:var(--blue)}
.sp-header{display:flex;align-items:baseline;gap:20px;margin-bottom:28px;flex-wrap:wrap}
.sp-title{font-size:22px;font-weight:700;margin:0}
.sp-pnl{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}
.sp-meta{color:var(--muted);font-size:13.5px;margin-top:4px}
.drop-zone{border:2px dashed var(--line);border-radius:12px;padding:40px 24px;text-align:center;cursor:pointer;transition:.15s;margin:28px 0}
.drop-zone:hover,.drop-zone.drag-over{border-color:var(--blue);background:rgba(91,157,249,.04)}
.drop-icon{font-size:36px;margin-bottom:10px}
.drop-label{font-size:14px;font-weight:600;color:var(--txt);margin-bottom:4px}
.drop-sub{font-size:12.5px;color:var(--muted)}
.trades-table{width:100%;border-collapse:collapse;font-size:13.5px;margin-top:8px}
.trades-table th{text-align:left;padding:7px 12px;font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--line)}
.trades-table td{padding:9px 12px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums;vertical-align:middle}
.trades-table tr:last-child td{border-bottom:none}
.trades-table tr:hover td{background:rgba(91,157,249,.04)}
.td-pnl{font-weight:700;text-align:right}
.td-w{color:var(--green)} .td-l{color:var(--red)}
.section-title{font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:28px 0 10px}
.clear-btn{background:none;border:1px solid var(--line);border-radius:6px;padding:5px 12px;font-size:12px;color:var(--muted);cursor:pointer;margin-top:16px}
.clear-btn:hover{border-color:var(--red);color:var(--red)}
.note-block{background:var(--panel);border-left:3px solid var(--blue);border-radius:8px;padding:14px 18px;font-size:13.5px;color:var(--txt);line-height:1.6;margin:20px 0}
</style>
</head>
<body>
<div class="wrap">

<a href="../" class="sp-back">← Journal</a>

<div class="sp-header">
  <h1 class="sp-title">Mardi 25 août</h1>
  <span class="sp-pnl neg">-475.00 $</span>
</div>
<div class="sp-meta">11 trades &nbsp;·&nbsp; Taux de réussite&nbsp;: <strong>45%</strong></div>

<div class="note-block">C02 −305 · C06 −170 · 11 trades MNQU6.</div>

<div class="section-title">Trades de la session</div>

<div id="drop-zone" class="drop-zone" onclick="document.getElementById('csv-input').click()">
  <input type="file" id="csv-input" accept=".csv" style="display:none">
  <div class="drop-icon">📂</div>
  <div class="drop-label">Glisse ton CSV Tradovate ici</div>
  <div class="drop-sub">ou clique pour sélectionner le fichier · Performance Report ou Fills</div>
</div>

<div id="trades-container" style="display:none">
  <div class="tbl-wrap">
    <table class="trades-table">
      <thead>
        <tr>
          <th>#</th>
          <th>Compte</th>
          <th>Contrat</th>
          <th>Sens</th>
          <th>Qté</th>
          <th>Entrée</th>
          <th>Sortie</th>
          <th>Heure</th>
          <th>P&amp;L</th>
        </tr>
      </thead>
      <tbody id="trades-body"></tbody>
    </table>
  </div>
  <button class="clear-btn" onclick="clearTrades()">Effacer les trades</button>
</div>

</div>

<script>
var SESSION_KEY = 'trades_2026_08_25_mardi';

// Load saved trades on startup
window.addEventListener('DOMContentLoaded', function(){
  try {
    var saved = localStorage.getItem(SESSION_KEY);
    if(saved) renderTrades(JSON.parse(saved));
  } catch(e) {}

  var dz = document.getElementById('drop-zone');
  var fi = document.getElementById('csv-input');

  dz.addEventListener('dragover', function(e){ e.preventDefault(); dz.classList.add('drag-over'); });
  dz.addEventListener('dragleave', function(){ dz.classList.remove('drag-over'); });
  dz.addEventListener('drop', function(e){
    e.preventDefault(); dz.classList.remove('drag-over');
    var f = e.dataTransfer.files[0];
    if(f) readCSV(f);
  });
  fi.addEventListener('change', function(){
    if(fi.files[0]) readCSV(fi.files[0]);
  });
});

function readCSV(file){
  var reader = new FileReader();
  reader.onload = function(e){ parseCSV(e.target.result); };
  reader.readAsText(file, 'UTF-8');
}

function parseCSV(text){
  // Normalize line endings
  var lines = text.replace(/\r\n/g,'\n').replace(/\r/g,'\n').split('\n').filter(function(l){ return l.trim(); });
  if(lines.length < 2) { alert('CSV vide ou invalide.'); return; }

  // Parse header
  var header = splitCSV(lines[0]);
  var col = {};
  header.forEach(function(h,i){ col[h.trim().toLowerCase()] = i; });

  // Detect format: Performance vs Fills
  var isPerfReport = 'gain/loss' in col || 'p&l' in col || 'profit' in col;

  var trades = [];

  if(isPerfReport){
    // Tradovate Performance Report
    // Columns: Account, B/S, Qty, Symbol/Contract, Price (avg entry), Commission, Entry Time, Exit Time, P&L
    var colAcct  = firstCol(col, ['account']);
    var colSym   = firstCol(col, ['symbol','contract','instrument']);
    var colSide  = firstCol(col, ['b/s','side','direction']);
    var colQty   = firstCol(col, ['qty','quantity']);
    var colEntry = firstCol(col, ['avg entry price','entry price','entry']);
    var colExit  = firstCol(col, ['avg exit price','exit price','exit price','exit']);
    var colPnl   = firstCol(col, ['gain/loss','p&l','profit','net p&l']);
    var colTime  = firstCol(col, ['entry time','time','bought timestamp','date/time']);
    var colExit2 = firstCol(col, ['exit time','sold timestamp']);

    for(var i=1;i<lines.length;i++){
      var row = splitCSV(lines[i]);
      if(row.length < 3) continue;
      var pnl = parseFloat((row[colPnl]||'').replace(/[$,\s]/g,''));
      if(isNaN(pnl) && colPnl === undefined) continue;
      trades.push({
        n: trades.length+1,
        account: (row[colAcct]||'').trim(),
        contract: (row[colSym]||'').trim(),
        side: (row[colSide]||'').trim(),
        qty: (row[colQty]||'').trim(),
        entry: (row[colEntry]||'').trim(),
        exit: colExit !== undefined ? (row[colExit]||'').trim() : '',
        time: (row[colTime]||'').trim(),
        pnl: isNaN(pnl) ? null : pnl
      });
    }
  } else {
    // Fills CSV — group by account+contract+side+boughtTimestamp
    var colAcct  = firstCol(col, ['account','accountid','account id']);
    var colSym   = firstCol(col, ['symbol','contract','instrument','contractname']);
    var colSide  = firstCol(col, ['buy/sell','side','b/s','action']);
    var colQty   = firstCol(col, ['qty','quantity','filled qty','filledqty']);
    var colPrice = firstCol(col, ['price','avg price','fill price']);
    var colComm  = firstCol(col, ['commission','comm']);
    var colTime  = firstCol(col, ['bought timestamp','sold timestamp','time','fill time','timestamp','date/time']);

    // Group fills into trades: same account+contract+time-window
    var groups = {};
    for(var i=1;i<lines.length;i++){
      var row = splitCSV(lines[i]);
      if(row.length < 3) continue;
      var acct = (row[colAcct]||'').trim();
      var sym  = (row[colSym]||'').trim();
      var side = (row[colSide]||'').trim();
      var qty  = parseFloat((row[colQty]||'').replace(/[,\s]/g,'')) || 0;
      var price= parseFloat((row[colPrice]||'').replace(/[,\s]/g,'')) || 0;
      var comm = parseFloat((row[colComm]||'').replace(/[$,\s]/g,'')) || 0;
      var ts   = (row[colTime]||'').trim();

      // Key: account + symbol + side + minute of timestamp
      var minKey = ts.substring(0,16);
      var key = acct+'|'+sym+'|'+side+'|'+minKey;
      if(!groups[key]) groups[key] = { account:acct, contract:sym, side:side, qty:0, price:0, comm:0, time:ts, fills:0 };
      groups[key].qty += qty;
      groups[key].price += price * qty; // weighted
      groups[key].comm += comm;
      groups[key].fills++;
    }

    // Build trades: match buy+sell groups for same account+contract
    var byAcctSym = {};
    Object.keys(groups).forEach(function(k){
      var g = groups[k];
      var as = g.account+'|'+g.contract;
      if(!byAcctSym[as]) byAcctSym[as] = [];
      byAcctSym[as].push(g);
    });

    Object.keys(byAcctSym).forEach(function(as){
      var fills = byAcctSym[as];
      var buys = fills.filter(function(f){ return /buy|long|B/i.test(f.side); });
      var sells = fills.filter(function(f){ return /sell|short|S/i.test(f.side); });
      var n = Math.max(buys.length, sells.length);
      for(var i=0;i<n;i++){
        var buy = buys[i];
        var sell = sells[i];
        if(!buy && !sell) continue;
        var entry = buy || sell;
        var exitF = (buy ? sell : buy) || null;
        var entryPrice = entry.qty > 0 ? entry.price/entry.qty : 0;
        var exitPrice  = exitF && exitF.qty > 0 ? exitF.price/exitF.qty : 0;
        var qty = Math.min(entry.qty, exitF ? exitF.qty : entry.qty);
        // P&L rough estimate (contract multiplier unknown — show raw)
        trades.push({
          n: trades.length+1,
          account: entry.account,
          contract: entry.contract,
          side: entry.side,
          qty: qty.toFixed(0),
          entry: entryPrice.toFixed(2),
          exit: exitPrice > 0 ? exitPrice.toFixed(2) : '—',
          time: entry.time,
          pnl: null // can't compute without multiplier
        });
      }
    });
  }

  if(trades.length === 0){ alert('Aucun trade trouvé dans ce fichier. Vérifie le format.'); return; }
  try{ localStorage.setItem(SESSION_KEY, JSON.stringify(trades)); }catch(e){}
  renderTrades(trades);
}

function firstCol(col, keys){
  for(var i=0;i<keys.length;i++) if(keys[i] in col) return col[keys[i]];
  return undefined;
}

function splitCSV(line){
  var result=[], cur='', inQ=false;
  for(var i=0;i<line.length;i++){
    var c=line[i];
    if(c==='"'){ inQ=!inQ; }
    else if(c===','&&!inQ){ result.push(cur); cur=''; }
    else cur+=c;
  }
  result.push(cur);
  return result;
}

function renderTrades(trades){
  var body = document.getElementById('trades-body');
  var html = '';
  trades.forEach(function(t){
    var pnlStr = t.pnl !== null ? ((t.pnl>=0?'+':'')+t.pnl.toFixed(2)+' $') : '—';
    var pnlCls = t.pnl === null ? '' : (t.pnl >= 0 ? 'td-w' : 'td-l');
    html += '<tr>'
      + '<td>' + t.n + '</td>'
      + '<td>' + esc(t.account) + '</td>'
      + '<td><strong>' + esc(t.contract) + '</strong></td>'
      + '<td>' + esc(t.side) + '</td>'
      + '<td>' + esc(t.qty) + '</td>'
      + '<td>' + esc(t.entry) + '</td>'
      + '<td>' + esc(t.exit||'—') + '</td>'
      + '<td style="color:var(--muted);font-size:12px">' + esc(t.time) + '</td>'
      + '<td class="td-pnl ' + pnlCls + '">' + pnlStr + '</td>'
      + '</tr>';
  });
  body.innerHTML = html;
  document.getElementById('trades-container').style.display='block';
  document.getElementById('drop-zone').style.display='none';
}

function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function clearTrades(){
  try{ localStorage.removeItem(SESSION_KEY); }catch(e){}
  document.getElementById('trades-container').style.display='none';
  document.getElementById('drop-zone').style.display='block';
  document.getElementById('csv-input').value='';
}
</script>
</body>
</html>
