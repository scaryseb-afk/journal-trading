<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vendredi 28 août — Journal</title>
<link rel="stylesheet" href="../_systeme/style.css">
<style>
.sp-back{color:var(--muted);font-weight:600;font-size:.88rem;text-decoration:none;display:inline-flex;align-items:center;gap:6px;margin-bottom:24px}
.sp-back:hover{color:var(--blue)}
.sp-header{display:flex;align-items:baseline;gap:20px;margin-bottom:6px;flex-wrap:wrap}
.sp-title{font-size:22px;font-weight:700;margin:0}
.sp-pnl{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}
.sp-meta{color:var(--muted);font-size:13.5px;margin-bottom:24px}
.note-block{background:var(--panel);border-left:3px solid var(--blue);border-radius:8px;padding:14px 18px;font-size:13.5px;color:var(--txt);line-height:1.6;margin-bottom:28px}
.section-title{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:28px 0 10px}

.drop-zone{border:2px dashed var(--line);border-radius:10px;padding:28px 16px;text-align:center;cursor:pointer;transition:.15s}
.drop-zone:hover,.drop-zone.drag-over{border-color:var(--blue);background:rgba(91,157,249,.05)}
.drop-icon{font-size:28px;margin-bottom:8px}
.drop-label{font-size:13px;font-weight:600;color:var(--txt);margin-bottom:3px}
.drop-sub{font-size:11.5px;color:var(--muted)}

/* Screenshots */
.screenshots{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:16px}
.screenshot-wrap{position:relative;border-radius:8px;overflow:hidden;border:1px solid var(--line)}
.screenshot-wrap img{display:block;max-width:320px;max-height:240px;object-fit:contain}
.screenshot-del{position:absolute;top:6px;right:6px;background:rgba(0,0,0,.55);color:#fff;border:none;border-radius:50%;width:22px;height:22px;font-size:14px;line-height:22px;cursor:pointer;display:flex;align-items:center;justify-content:center}

/* Trades table */
.trades-table{width:100%;border-collapse:collapse;font-size:13.5px}
.trades-table th{text-align:left;padding:7px 12px;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--line)}
.trades-table td{padding:9px 12px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.trades-table tr:last-child td{border-bottom:none}
.trades-table tr:hover td{background:rgba(91,157,249,.04)}
.td-pnl{font-weight:700;text-align:right}
.td-w{color:var(--green)} .td-l{color:var(--red)}
.clear-btn{background:none;border:1px solid var(--line);border-radius:6px;padding:5px 14px;font-size:12px;color:var(--muted);cursor:pointer;margin-top:12px}
.clear-btn:hover{border-color:var(--red);color:var(--red)}

/* Trade notes */
.note-row td{padding:4px 12px 10px;border-bottom:1px solid var(--line)}
.trade-note{width:100%;min-height:52px;resize:vertical;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--txt);font-size:12.5px;font-family:inherit;padding:8px 10px;box-sizing:border-box;outline:none;transition:.15s}
.trade-note:focus{border-color:var(--blue);background:var(--panel)}
.trade-note::placeholder{color:var(--muted);opacity:.7}
</style>
</head>
<body>
<div class="wrap">

<a href="https://scaryseb-afk.github.io/journal-trading/#sessions" onclick="if(document.referrer){history.back();return false;}" class="sp-back">← Journal</a>

<div class="sp-header">
  <h1 class="sp-title">Vendredi 28 août</h1>
  <span class="sp-pnl neg">-167.00 $</span>
</div>
<div class="sp-meta">6 trades &nbsp;·&nbsp; Taux de réussite&nbsp;: <strong>33%</strong></div>

<div class="note-block">C06 −298 $ (3 shorts contre tendance) · C00? +131 $ (3 longs).</div>

<div id="trades-container" style="display:none">
  <div class="section-title">📊 Trades</div>
  <div class="tbl-wrap">
    <table class="trades-table">
      <thead><tr><th>#</th><th>Compte</th><th>Contrat</th><th>Sens</th><th>Qté</th><th>Entrée</th><th>Sortie</th><th>Heure</th><th>P&amp;L</th></tr></thead>
      <tbody id="trades-body"></tbody>
    </table>
  </div>
  <button class="clear-btn" onclick="clearTrades()">Effacer les trades</button>
</div>

<div class="section-title">📸 Captures d'écran</div>
<div id="img-zone" class="drop-zone" style="max-width:340px" onclick="document.getElementById('img-input').click()">
  <input type="file" id="img-input" accept="image/*" multiple style="display:none">
  <div class="drop-icon">🖼️</div>
  <div class="drop-label">Ajouter des captures</div>
  <div class="drop-sub">PNG, JPG</div>
</div>
<div id="screenshots" class="screenshots" style="margin-top:12px"></div>
<div id="img-clear-wrap" style="display:none">
  <button class="clear-btn" onclick="clearScreenshots()">Effacer les captures</button>
</div>

</div>

<script>
var KEY_TRADES = 'trades_2026_08_28_vendredi';
var KEY_IMGS   = 'imgs_2026_08_28_vendredi';
var KEY_NOTES  = 'notes_2026_08_28_vendredi';

window.addEventListener('DOMContentLoaded', function(){
  // Restore saved data
  try{
    var t = localStorage.getItem(KEY_TRADES);
    if(t) renderTrades(JSON.parse(t));
    var imgs = JSON.parse(localStorage.getItem(KEY_IMGS)||'[]');
    if(imgs.length) renderScreenshots(imgs);
  }catch(e){}

  // Image drop
  setupDrop('img-zone', 'img-input', function(f){
    if(f.type.startsWith('image/')) readImage(f);
  }, true);
});

function setupDrop(zoneId, inputId, handler, multi){
  var dz = document.getElementById(zoneId);
  var fi = document.getElementById(inputId);
  dz.addEventListener('dragover', function(e){ e.preventDefault(); dz.classList.add('drag-over'); });
  dz.addEventListener('dragleave', function(){ dz.classList.remove('drag-over'); });
  dz.addEventListener('drop', function(e){
    e.preventDefault(); dz.classList.remove('drag-over');
    Array.from(e.dataTransfer.files).forEach(handler);
  });
  fi.addEventListener('change', function(){ Array.from(fi.files).forEach(handler); });
}


function renderTrades(trades){
  var notes=loadNotes();
  var body=document.getElementById('trades-body'),html='';
  trades.forEach(function(t){
    var ps=t.pnl!==null?((t.pnl>=0?'+':'')+t.pnl.toFixed(2)+' $'):'—';
    var pc=t.pnl===null?'':(t.pnl>=0?'td-w':'td-l');
    var note=notes[t.n]||'';
    html+='<tr class="trade-row"><td>'+t.n+'</td><td>'+esc(t.account)+'</td><td><strong>'+esc(t.contract)+'</strong></td>'
      +'<td>'+esc(t.side)+'</td><td>'+esc(t.qty)+'</td><td>'+esc(t.entry)+'</td><td>'+esc(t.exit||'—')+'</td>'
      +'<td style="color:var(--muted);font-size:12px">'+esc(t.time)+'</td>'
      +'<td class="td-pnl '+pc+'">'+ps+'</td></tr>'
      +'<tr class="note-row"><td colspan="9">'
      +'<textarea class="trade-note" placeholder="Setup, raison du trade, erreurs…" data-n="'+t.n+'" onblur="saveNote(this)">'
      +(note?note.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'):'')
      +'</textarea></td></tr>';
  });
  document.getElementById('trades-body').innerHTML=html;
  document.getElementById('trades-container').style.display='block';
}
function loadNotes(){try{return JSON.parse(localStorage.getItem(KEY_NOTES)||'{}');}catch(e){return{};}}
function saveNote(el){
  var n=el.getAttribute('data-n');
  var notes=loadNotes();
  var val=el.value.trim();
  if(val) notes[n]=val; else delete notes[n];
  try{localStorage.setItem(KEY_NOTES,JSON.stringify(notes));}catch(e){}
}
function clearTrades(){
  try{localStorage.removeItem(KEY_TRADES);localStorage.removeItem(KEY_NOTES);}catch(e){}
  document.getElementById('trades-container').style.display='none';
}

/* ── Images ── */
function readImage(file){
  var r=new FileReader();
  r.onload=function(e){
    var imgs=[];
    try{imgs=JSON.parse(localStorage.getItem(KEY_IMGS)||'[]');}catch(x){}
    imgs.push(e.target.result);
    try{localStorage.setItem(KEY_IMGS,JSON.stringify(imgs));}catch(x){
      alert('Image trop lourde pour le stockage navigateur — essaie une capture plus petite.');return;
    }
    renderScreenshots(imgs);
  };
  r.readAsDataURL(file);
}
function renderScreenshots(imgs){
  var wrap=document.getElementById('screenshots'),html='';
  imgs.forEach(function(src,i){
    html+='<div class="screenshot-wrap">'
      +'<img src="'+src+'" alt="Capture '+i+'">'
      +'<button class="screenshot-del" onclick="delScreenshot('+i+')" title="Supprimer">×</button>'
      +'</div>';
  });
  wrap.innerHTML=html;
  document.getElementById('img-clear-wrap').style.display=imgs.length?'block':'none';
  document.getElementById('img-zone').style.display=imgs.length?'none':'block';
}
function delScreenshot(idx){
  var imgs=[];
  try{imgs=JSON.parse(localStorage.getItem(KEY_IMGS)||'[]');}catch(e){}
  imgs.splice(idx,1);
  try{localStorage.setItem(KEY_IMGS,JSON.stringify(imgs));}catch(e){}
  renderScreenshots(imgs);
  if(!imgs.length) document.getElementById('img-zone').style.display='block';
}
function clearScreenshots(){
  try{localStorage.removeItem(KEY_IMGS);}catch(e){}
  document.getElementById('screenshots').innerHTML='';
  document.getElementById('img-clear-wrap').style.display='none';
  document.getElementById('img-zone').style.display='block';
}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
</script>
</body>
</html>
